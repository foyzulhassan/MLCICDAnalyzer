name: YOLOv5 CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train YOLOv5n
        run: |
          m=yolov5n
          python3 train.py --imgsz 64 --batch 32 --weights $m.pt --cfg $m.yaml --epochs 1 --device cpu

      - name: Validate and Test YOLOv5n
        run: |
          m=yolov5n
          b=runs/train/exp/weights/best
          for d in cpu; do
            for w in $m $b; do
              python3 val.py --imgsz 64 --batch 32 --weights $w.pt --device $d
              python3 detect.py --imgsz 64 --weights $w.pt --device $d
            done
          done

      - name: Hub and Model Conversion YOLOv5n
        run: |
          m=yolov5n
          python3 hubconf.py --model $m
          python3 models/yolo.py --cfg $m.yaml
          python3 export.py --weights $m.pt --img 64 --include torchscript
          python3 - <<EOF
          import torch
          im = torch.zeros([1, 3, 64, 64])
          for path in '$m', '$b':
              model = torch.hub.load('.', 'custom', path=path, source='local')
              print(model('data/images/bus.jpg'))
              model(im)
              torch.jit.trace(model, [im])
          EOF

      - name: Train YOLOv5n-seg
        run: |
          m=yolov5n-seg
          python3 segment/train.py --imgsz 64 --batch 32 --weights $m.pt --cfg $m.yaml --epochs 1 --device cpu
          python3 segment/train.py --imgsz 64 --batch 32 --weights '' --cfg $m.yaml --epochs 1 --device cpu

      - name: Validate, Predict, and Export YOLOv5n-seg
        run: |
          m=yolov5n-seg
          b=runs/train-seg/exp/weights/best
          for d in cpu; do
            for w in $m $b; do
              python3 segment/val.py --imgsz 64 --batch 32 --weights $w.pt --device $d
              python3 segment/predict.py --imgsz 64 --weights $w.pt --device $d
              python3 export.py --weights $w.pt --img 64 --include torchscript --device $d
            done
          done

      - name: Train and Validate YOLOv5n-cls
        run: |
          m=yolov5n-cls.pt
          b=runs/train-cls/exp/weights/best.pt
          python3 classify/train.py --imgsz 32 --model $m --data mnist160 --epochs 1
          python3 classify/val.py --imgsz 32 --weights $b --data ../datasets/mnist160

      - name: Predict and Export YOLOv5n-cls
        run: |
          m=yolov5n-cls.pt
          b=runs/train-cls/exp/weights/best.pt
          python3 classify/predict.py --imgsz 32 --weights $b --source ../datasets/mnist160/test/7/60.png
          python3 classify/predict.py --imgsz 32 --weights $m --source data/images/bus.jpg
          python3 export.py --weights $b --img 64 --include torchscript
          python3 - <<EOF
          import torch
          for path in '$m', '$b':
              model = torch.hub.load('.', 'custom', path=path, source='local')
          EOF

      - name: Benchmarks
        run: |
          python3 benchmarks.py --data coco128.yaml --weights yolov5n.pt --img 320 --hard-fail 0.29
          python3 benchmarks.py --data coco128-seg.yaml --weights yolov5n-seg.pt --img 320 --hard-fail 0.22

      - name: ONNX Export and Inference
        run: |
          python3 export.py --weights yolov5n-cls.pt --include onnx --img 224
          python3 detect.py --weights yolov5n.onnx --img 320
          python3 segment/predict.py --weights yolov5n-seg.onnx --img 320
          python3 classify/predict.py --weights yolov5n-cls.onnx --img 224

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy application
        run: |
          echo "Deploying to production..."
