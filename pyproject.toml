[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "MLCICDAnalyzer"
version = "1.0.0"
description = "Synthesize GitHub Actions Workflows via Runtime-based Analysis"
readme = "README.md"
requires-python = ">=3.10"
license = ""
keywords = [
  "github actions",
  "code generation",
  "runtime analysis",
]
authors = [
  { name = "Javid Ditty", email = "jditty@umich.edu" },
  { name = "Rahul Ghanshyam Chavan", email = "rchavan@umich.edu" },
  { name = "Foyzul Hassan", email = "foyzul@umich.edu" },
]
maintainers = [
  { name = "Javid Ditty", email = "jditty@umich.edu" },
  { name = "Rahul Ghanshyam Chavan", email = "rchavan@umich.edu" },
  { name = "Foyzul Hassan", email = "foyzul@umich.edu" },
]
dependencies = [
  "bashlex==0.18",
  "jsonschema==4.23.0",
  "numpy==2.1.3",
  "openai==1.56.2",
  "pandas==2.2.3",
  "pymoo==0.6.1.3",
  "requirements-parser==0.11.0",
  "ruamel.yaml==0.18.6",
  "toml==0.10.2",
  "tree-sitter==0.24.0",
  "tree-sitter-bash==0.23.3",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]

[project.urls]
Documentation = "https://github.com/foyzulhassan/MLCICDAnalyzer#readme"
Issues = "https://github.com/foyzulhassan/MLCICDAnalyzer/issues"
Source = "https://github.com/foyzulhassan/MLCICDAnalyzer"