# name of the workflow to be produced (will be used to create the output directory)
workflow_name = "workflow"

# ordered list of absolute paths to target scripts 
target_paths = []

# absolute path to directory where outputs will be stored
output_dir = ""

# absolute path to a pip requirements file
requirements_path = ""

# absolute path to a pip requirements file
repository_dir = ""

# absolute path to a directory to run targets in
working_dir = ""

# absolute path to a directory that contains the patcher (i.e. sitecustomize.py)
patch_dir = ""

# absolute path to a file that contains a package tracer (i.e. packages.py)
packages_path = ""

# OpenAI API key for LLM interaction
api_key = ""

# whether outputs should be preserved
keep_output = true

# whether to trace the targets again if trace logs are already present
new_trace = false

# absolute path to a log listing the docker containers on the machine (generated with this tool)
docker_path = ""

# absolute path to a file containing rejected environmental variables
env_filter_path = ""